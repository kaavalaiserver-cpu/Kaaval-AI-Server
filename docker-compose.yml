version: '3.8'

services:
  frontend:
    build:
      context: ./admin dashboard/kaaval_dashboard
      dockerfile: Dockerfile
    container_name: kaaval-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./admin dashboard/kaaval-backend
      dockerfile: Dockerfile
    container_name: kaaval-backend
    expose:
      - "8003"
    ports:
      # SECURITY: Bind to localhost only — nginx proxies /api/ internally
      - "127.0.0.1:8003:8003"
    environment:
      - NODE_ENV=production
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - RDK_API_KEY=${RDK_API_KEY}
      - EMAIL_PASS=${EMAIL_PASS}
      - LOCAL_UPLOAD_DIR=${LOCAL_UPLOAD_DIR}
      - LOCAL_BACKUP_DIR=${LOCAL_BACKUP_DIR}
      - LOCAL_EXPORT_DIR=${LOCAL_EXPORT_DIR}
      - AI_BACKEND_URL=http://evidence_api:8001
    volumes:
      - F:/kaaval ai database/uploads:/app/data/uploads
      - F:/kaaval ai database/logs:/usr/src/app/logs
      - F:/kaaval ai database/backups:/app/data/backups
      - F:/kaaval ai database/exports:/app/data/exports
      - F:/kaaval ai database:/host_f_drive:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8003/api/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: kaaval-postgres
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    # SECURITY: No public port — DB only accessible inside Docker network
    expose:
      - "5432"
    volumes:
      - F:/kaaval ai database/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaaval_ai"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  evidence_api:
    build:
      context: ./kaaval_api
      dockerfile: Dockerfile
    container_name: kaaval-evidence-api
    expose:
      - "8001"
    ports:
      # RDK kits push violation data here from LAN — must remain accessible on local network
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RDK_API_KEY=${RDK_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_REGION=${AWS_REGION}
      - S3_IMAGES_BUCKET=${S3_IMAGES_BUCKET}
      - S3_PREVIEW_BUCKET=${S3_PREVIEW_BUCKET}
      - PRESIGN_TTL=${PRESIGN_TTL}
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:80","http://localhost"]
      - AI_MODELS_DIR=${AI_MODELS_DIR}
      - LOCAL_UPLOAD_DIR=${LOCAL_UPLOAD_DIR}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - ALERT_RECIPIENT_EMAIL=${ALERT_RECIPIENT_EMAIL}
    volumes:
      - F:/kaaval ai database/ai_models:/app/ai_models
      - F:/kaaval ai database/uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  rdk-monitor-backend:
    build:
      context: ../Kaaval AI Tech Dashboard/backend
      dockerfile: Dockerfile
    container_name: rdk-monitor-backend
    expose:
      - "8011"
    ports:
      # SECURITY: Bind to localhost only — proxied through nginx /tech-api/
      - "127.0.0.1:8011:8011"
    environment:
      - NODE_ENV=production
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - EMAIL_PASS=${EMAIL_PASS}
      - JWT_SECRET=${JWT_MONITOR_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  rdk-monitor-frontend:
    build:
      context: ../Kaaval AI Tech Dashboard/frontend
      dockerfile: Dockerfile
    container_name: rdk-monitor-frontend
    ports:
      - "8010:80"
    depends_on:
      - rdk-monitor-backend
    restart: unless-stopped
